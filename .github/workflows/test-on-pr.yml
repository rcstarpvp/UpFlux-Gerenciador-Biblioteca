name: Test on Pull Request

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore Backend/GerenciamentoBiblioteca.sln
      
    - name: Build solution
      run: dotnet build Backend/GerenciamentoBiblioteca.sln --no-restore --configuration Release
      
    - name: Run tests with coverage
      run: dotnet test Backend/GerenciamentoBiblioteca.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --verbosity normal
      
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./Backend/GerenciamentoBiblioteca.Tests/TestResults/
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false