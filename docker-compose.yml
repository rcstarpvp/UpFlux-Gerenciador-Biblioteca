services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gerenciamento-biblioteca-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - biblioteca-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./Backend
      dockerfile: GerenciamentoBiblioteca.API/Dockerfile
    container_name: gerenciamento-biblioteca-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=LibraryManagementDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=true;MultipleActiveResultSets=true;ConnectRetryCount=3;ConnectRetryInterval=30;
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - biblioteca-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gerenciamento-biblioteca-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - biblioteca-network
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  biblioteca-network:
    driver: bridge
